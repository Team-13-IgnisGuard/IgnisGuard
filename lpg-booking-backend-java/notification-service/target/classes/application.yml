server:
  port: 8084

spring:
  application:
    name: notification-service
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

notification:
  email-log-path: ./mock_emails.txt

# SMS is OFF by default so the app works out of the box without a paid account.
# To send real SMS: sign up at fast2sms.com, set enabled: true and paste your API key below.
# Until then, every SMS is simulated and written to the same log file as the mock emails.
sms:
  enabled: false
  api-key: YOUR_FAST2SMS_API_KEY_HERE
  api-url: https://www.fast2sms.com/dev/bulkV2
